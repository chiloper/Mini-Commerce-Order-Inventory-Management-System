services:
  mysql-web:
    image: phpmyadmin:latest
    container_name: mysql_web
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment: 
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myweb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword 
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
    